<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1565c0"><link rel="manifest" href="manifest.json">
<title>Society Dues</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6f8;color:#17202a}
header{background:#1565c0;color:#fff;padding:17px 15px;position:sticky;top:0;z-index:5}
h1{font-size:21px;margin:0 0 4px}.sub{font-size:13px}
main{max-width:900px;margin:auto;padding:12px 10px 90px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:10}
nav button{flex:1;border:0;background:#fff;padding:10px 2px;font-size:11px;color:#555}nav button.active{color:#1565c0;font-weight:bold}
.card{background:#fff;border-radius:14px;padding:15px;margin:9px 0;box-shadow:0 1px 5px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{font-size:12px;color:#666}.value{font-size:20px;font-weight:bold;margin-top:4px}
input,select,button{font:inherit}input,select{width:100%;padding:10px;border:1px solid #cbd2d9;border-radius:8px;background:#fff}
.btn{border:0;border-radius:8px;padding:10px 12px;background:#1565c0;color:#fff}.btn.secondary{background:#e8eef7;color:#1565c0}
.row{display:flex;gap:7px;align-items:center}.row>*{flex:1}.row .label{flex:0 0 45px}
.title{font-size:18px;font-weight:bold;margin:4px 0 12px}.notice{padding:10px;border-radius:8px;background:#fff7db;margin:9px 0;font-size:13px}
.table-wrap{overflow:auto}.fundtable{width:100%;border-collapse:collapse;min-width:850px}.fundtable th,.fundtable td{padding:7px;border-bottom:1px solid #eee;text-align:left;font-size:12px}.fundtable th{background:#f5f7f9}
.paid{color:#19733a;font-weight:bold}.unpaid{color:#b42318;font-weight:bold}.hidden{display:none}
.dashboard-group-one{border:3px solid #087f5b;padding:7px;margin:0 0 4px;background:#fff}
.dashboard-group-two{border:3px solid #1261c9;padding:7px;margin:0;background:#f4f6f8}
.dashboard-group-one .card,.dashboard-group-two .card{margin:8px 0}
.expensetable{width:100%;border-collapse:collapse;min-width:650px}
.expensetable th,.expensetable td{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:12px}
.expensetable th{background:#f5f7f9}
</style></head><body>
<header><h1>🏢 Society Dues</h1><div class="sub">40 flats • Maintenance ₹2,500/month</div></header>
<main id="app"></main>
<nav><button data-page="dashboard">🏠<br>Dashboard</button><button data-page="dues">💰<br>Dues</button><button data-page="residents">👤<br>Residents</button><button data-page="funds">💵<br>Funds</button><button data-page="expense">🧾<br>Expense</button><button data-page="reports">📊<br>Reports</button></nav>
<script>
const KEY="society_dues_v4", flats=[];
for(let f=1;f<=6;f++) for(const l of ["A","B","C","D","E","F"]) flats.push(f+l);
for(const l of ["A","B","C","D"]) flats.push("7"+l);
let data=JSON.parse(localStorage.getItem(KEY)||"null")||{residents:{},carpet:{},payments:{},funds:{},expenses:{}};
const nowMonth=()=>new Date().toISOString().slice(0,7);
const month=()=>document.getElementById("month")?.value||nowMonth();
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function pay(f,m){let k=f+"_"+m;if(!data.payments[k])data.payments[k]={status:"Unpaid",date:""};return data.payments[k]}
function fund(f,m){let k=f+"_"+m;if(!data.funds[k])data.funds[k]={corpusActual:0,corpusPaid:0,builderActual:0,builderPaid:0};return data.funds[k]}
function months(){let a=[];for(let yy=2022;yy<=2040;yy++)for(let m=1;m<=12;m++)a.push(`${yy}-${String(m).padStart(2,"0")}`);return a}
function monthBox(){let nm=nowMonth(),opts=months();if(!opts.includes(nm))nm=opts[opts.length-1];return `<div class="card"><b>Period</b><select id="month">${opts.map(x=>`<option ${x==nm?"selected":""}>${x}</option>`).join("")}</select></div>`}
function dashboard(){
 let m=month(), selected=document.getElementById("flatSelect")?.value||flats[0];
 let p=flats.filter(f=>pay(f,m).status=="Paid").length,ca=0,cp=0,ba=0,bp=0;
 flats.forEach(f=>{let x=fund(f,m);ca+=+x.corpusActual;cp+=+x.corpusPaid;ba+=+x.builderActual;bp+=+x.builderPaid});
 let sp=pay(selected,m), sf=fund(selected,m);
 let societyUnpaid=sp.status=="Paid"?0:2500;
 let corpusUnpaid=Math.max(0,(+sf.corpusActual||0)-(+sf.corpusPaid||0));
 let builderUnpaid=Math.max(0,(+sf.builderActual||0)-(+sf.builderPaid||0));
 let totalUnpaid=societyUnpaid+corpusUnpaid+builderUnpaid;
 let expenses=(data.expenses[m]||[]).reduce((s,e)=>s+(+e.amount||0),0);
 let fundAvailable=(p*2500)+cp+bp-expenses;
 return `<div class="dashboard-group-one">
   ${monthBox()}
   <div class="card">
    <div class="title">Check Total Unpaid for a Flat</div>
    <select id="flatSelect">${flats.map(f=>`<option ${f==selected?"selected":""}>${f}</option>`).join("")}</select>
    <div class="muted" style="margin-top:7px">${data.residents[selected]||"Resident not entered"}</div>
   </div>
   <div class="grid">
    <div class="card"><div class="metric">Total Unpaid — ${selected}</div><div class="value">${money(totalUnpaid)}</div></div>
    <div class="card"><div class="metric">Pending Society Fee</div><div class="value">${money(societyUnpaid)}</div></div>
   </div>
 </div>
 <div class="dashboard-group-two">
   <div class="grid">
    <div class="card"><div class="metric">Corpus Fund Unpaid</div><div class="value">${money(corpusUnpaid)}</div></div>
    <div class="card"><div class="metric">Builder Unpaid</div><div class="value">${money(builderUnpaid)}</div></div>
    <div class="card"><div class="metric">Total Flats</div><div class="value">40</div></div>
    <div class="card"><div class="metric">Maintenance Paid</div><div class="value">${p}/40</div></div>
    <div class="card"><div class="metric">Maintenance Collected</div><div class="value">${money(p*2500)}</div></div>
    <div class="card"><div class="metric">Maintenance Pending</div><div class="value">${money((40-p)*2500)}</div></div>
    <div class="card"><div class="metric">Total Expenses</div><div class="value">${money(expenses)}</div></div>
    <div class="card"><div class="metric">Total Fund Available</div><div class="value">${money(fundAvailable)}</div></div>
    <div class="card"><div class="metric">Corpus Actual</div><div class="value">${money(ca)}</div></div>
    <div class="card"><div class="metric">Corpus Paid</div><div class="value">${money(cp)}</div></div>
    <div class="card"><div class="metric">Builder Actual</div><div class="value">${money(ba)}</div></div>
    <div class="card"><div class="metric">Builder Paid</div><div class="value">${money(bp)}</div></div>
   </div>
 </div>`;
}
function dues(){let m=month();return monthBox()+`<div class="card"><div class="notice">Maintenance dues: ₹2,500 per flat per month.</div>${flats.map(f=>{let p=pay(f,m);return `<div class="row" style="padding:10px 0;border-bottom:1px solid #eee"><b class="label">${f}</b><div>${data.residents[f]||"Resident not entered"}<br><small>${p.status}</small></div><button class="btn ${p.status=="Paid"?"secondary":""}" onclick="togglePay('${f}')">${p.status=="Paid"?"Paid":"Mark Paid"}</button></div>`}).join("")}</div>`}
function residents(){return `<div class="card"><div class="title">Resident / Owner & Carpet Area</div>${flats.map(f=>`<div class="row" style="margin:7px 0"><b class="label">${f}</b><input id="r${f}" value="${String(data.residents[f]||"").replaceAll('"',"&quot;")}" placeholder="Resident"><input id="a${f}" type="number" min="0" step=".01" value="${data.carpet[f]||""}" placeholder="Carpet sq.ft"><button class="btn" onclick="saveResident('${f}')">Save</button></div>`).join("")}<div class="notice">Enter each flat's carpet area. Fund amounts can differ for every flat.</div></div>`}
function funds(){let m=month(),ca=0,cp=0,ba=0,bp=0;flats.forEach(f=>{let x=fund(f,m);ca+=+x.corpusActual;cp+=+x.corpusPaid;ba+=+x.builderActual;bp+=+x.builderPaid});return monthBox()+`<div class="grid">
<div class="card"><div class="metric">Corpus Fund Actual</div><div class="value">${money(ca)}</div></div><div class="card"><div class="metric">Corpus Fund Paid</div><div class="value">${money(cp)}</div></div><div class="card"><div class="metric">Corpus Fund Unpaid</div><div class="value">${money(ca-cp)}</div></div>
<div class="card"><div class="metric">Builder Actual</div><div class="value">${money(ba)}</div></div><div class="card"><div class="metric">Builder Paid</div><div class="value">${money(bp)}</div></div><div class="card"><div class="metric">Builder Unpaid</div><div class="value">${money(ba-bp)}</div></div></div>
<div class="card"><div class="title">Fund Entries — ${m}</div><div class="notice">Each flat has separate amounts. Enter Actual and Paid. Unpaid is automatically Actual − Paid. Carpet area is shown for reference.</div>
<div class="table-wrap"><table class="fundtable"><thead><tr><th>Flat</th><th>Carpet</th><th>Corpus Actual</th><th>Corpus Paid</th><th>Corpus Unpaid</th><th>Builder Actual</th><th>Builder Paid</th><th>Builder Unpaid</th></tr></thead><tbody>
${flats.map(f=>{let x=fund(f,m),cu=+x.corpusActual-+x.corpusPaid,bu=+x.builderActual-+x.builderPaid;return `<tr><td><b>${f}</b></td><td>${data.carpet[f]||"-"}</td><td><input id="ca${f}" type="number" min="0" step=".01" value="${x.corpusActual||""}"></td><td><input id="cp${f}" type="number" min="0" step=".01" value="${x.corpusPaid||""}"></td><td class="${cu>0?"unpaid":"paid"}">${money(cu)}</td><td><input id="ba${f}" type="number" min="0" step=".01" value="${x.builderActual||""}"></td><td><input id="bp${f}" type="number" min="0" step=".01" value="${x.builderPaid||""}"></td><td class="${bu>0?"unpaid":"paid"}">${money(bu)}</td></tr>`}).join("")}</tbody></table></div><br><button class="btn" onclick="saveFunds()">Save All Fund Entries</button></div>`}
function expense(){
 let m=month(), arr=data.expenses[m]||[];
 let total=arr.reduce((s,e)=>s+(+e.amount||0),0);
 let paid=flats.filter(f=>pay(f,m).status=="Paid").length;
 let surplus=paid*2500-total;
 return monthBox()+`<div class="card">
   <div class="title">Monthly Expenses — ${m}</div>
   <div class="grid">
    <div><label>Type of expenses</label><input id="exType" placeholder="e.g. Electricity"></div>
    <div><label>Amount (₹)</label><input id="exAmount" type="number" min="0" step=".01" placeholder="0"></div>
    <div><label>Date</label><input id="exDate" type="date"></div>
    <div><label>Remark</label><input id="exRemark" placeholder="Optional"></div>
   </div>
   <br><button class="btn" onclick="addExpense()">Add Expense</button>
 </div>
 <div class="card">
  <div class="table-wrap"><table class="expensetable"><thead><tr><th>SL No</th><th>Type of Expenses</th><th>Amount</th><th>Date</th><th>Remark</th><th></th></tr></thead><tbody>
  ${arr.map((e,i)=>`<tr><td>${i+1}</td><td>${e.type}</td><td>${money(e.amount)}</td><td>${e.date||"-"}</td><td>${e.remark||"-"}</td><td><button class="btn secondary" onclick="deleteExpense(${i})">Delete</button></td></tr>`).join("")||`<tr><td colspan="6">No expenses entered for this month.</td></tr>`}
  </tbody></table></div>
 </div>
 <div class="grid">
  <div class="card"><div class="metric">Total Expenses — ${m}</div><div class="value">${money(total)}</div></div>
  <div class="card"><div class="metric">Surplus — Society Dues − Expenses</div><div class="value">${money(surplus)}</div></div>
 </div>`;
}
function reports(){let m=month(),cu=[],bu=[];flats.forEach(f=>{let x=fund(f,m),c=+x.corpusActual-+x.corpusPaid,b=+x.builderActual-+x.builderPaid;if(c>0)cu.push(f+" — "+money(c));if(b>0)bu.push(f+" — "+money(b))});return monthBox()+`<div class="card"><div class="title">Unpaid Funds — ${m}</div><b>Corpus Fund Unpaid</b>${cu.length?cu.map(x=>`<p>${x}</p>`).join(""):"<p>None</p>"}<hr><b>Payment to Builder Unpaid</b>${bu.length?bu.map(x=>`<p>${x}</p>`).join(""):"<p>None</p>"}</div><div class="card"><div class="title">Backup / Restore</div><button class="btn" onclick="backup()">Download Backup</button> <button class="btn secondary" onclick="document.getElementById('file').click()">Restore</button><input id="file" type="file" accept=".json" class="hidden" onchange="restore(event)"></div>`}
function addExpense(){
 let m=month(),type=document.getElementById("exType").value.trim(),amount=+(document.getElementById("exAmount").value||0),date=document.getElementById("exDate").value,remark=document.getElementById("exRemark").value.trim();
 if(!type||amount<=0){alert("Please enter expense type and a valid amount.");return}
 if(!data.expenses[m])data.expenses[m]=[];
 data.expenses[m].push({type,amount,date,remark});
 save();render("expense");
}
function deleteExpense(i){
 let m=month();
 if(confirm("Delete this expense?")){data.expenses[m].splice(i,1);save();render("expense")}
}
function render(page="dashboard"){
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page==page));
 document.getElementById("app").innerHTML=({dashboard,dues,residents,funds,expense,reports}[page])();
 document.getElementById("month")?.addEventListener("change",()=>render(page));
 document.getElementById("flatSelect")?.addEventListener("change",()=>render("dashboard"));
}
function togglePay(f){let p=pay(f,month());p.status=p.status=="Paid"?"Unpaid":"Paid";p.date=p.status=="Paid"?new Date().toLocaleDateString("en-IN"):"";save();render("dues")}
function saveResident(f){data.residents[f]=document.getElementById("r"+f).value.trim();data.carpet[f]=document.getElementById("a"+f).value;save();render("residents")}
function saveFunds(){let m=month();flats.forEach(f=>{let x=fund(f,m);x.corpusActual=+(document.getElementById("ca"+f).value||0);x.corpusPaid=+(document.getElementById("cp"+f).value||0);x.builderActual=+(document.getElementById("ba"+f).value||0);x.builderPaid=+(document.getElementById("bp"+f).value||0)});save();render("funds");alert("Fund entries saved for "+m)}
function backup(){let b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="society_dues_backup.json";a.click()}
function restore(e){let r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save();render();alert("Backup restored")}catch{alert("Invalid backup")}};r.readAsText(e.target.files[0])}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>render(b.dataset.page));render();
</script></body></html>
